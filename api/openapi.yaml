openapi: "3.0.3"
info:
  title: Nodoplex API
  description: >
    Graph-based project management platform. All project entities (visions,
    goals, features, requirements, tasks, outputs) are stored as nodes in a
    Neo4j graph connected by directed edges, giving every stakeholder a single
    shared view of how work connects to company goals.


    Every node belongs to exactly one namespace, an opaque string chosen by
    the caller when the node is created. Every operation is scoped to the
    namespace in its path: nodes in other namespaces behave exactly like
    nodes that don't exist, and edges can only connect nodes in the same
    namespace. Requests to the unprefixed paths (for example `/nodes`) are
    rejected with 400.
  version: "0.3.0"

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  # ── Nodes CRUD ──────────────────────────────────────────────
  /namespaces/{namespace}/nodes:
    parameters:
      - $ref: "#/components/parameters/Namespace"

    post:
      operationId: createNode
      summary: Create a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"

    get:
      operationId: listNodes
      summary: List and filter nodes
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/NodeType"
        - name: status
          in: query
          description: Filter tasks by status
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: search
          in: query
          description: Full-text search on title and description
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /namespaces/{namespace}/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"

    get:
      operationId: getNode
      summary: Get a node by ID with its direct relationships
      responses:
        "200":
          description: Node with relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeWithRelationships"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateNode
      summary: Partially update a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteNode
      summary: Delete a node and all its edges
      responses:
        "204":
          description: Node deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Edges ───────────────────────────────────────────────────
  /namespaces/{namespace}/edges:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    post:
      operationId: createEdge
      summary: Create an edge between two nodes
      description: >
        Both nodes must exist in the request's namespace. `BREAKS_DOWN_TO`
        and `IMPLEMENTED_BY` follow the breakdown hierarchy
        (vision → goal → feature → requirement → task → output).
        `DEPENDS_ON` means the source depends on the target; both nodes must
        have the same type, a node can't depend on itself, and an edge that
        would close a cycle of `DEPENDS_ON` edges is rejected with 409.
        Creating a `DEPENDS_ON` edge that already exists is idempotent and
        returns 201 without creating a second edge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEdgeRequest"
      responses:
        "201":
          description: Edge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Edge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The edge would create a cycle of DEPENDS_ON edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteEdge
      summary: Delete an edge between two nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteEdgeRequest"
      responses:
        "204":
          description: Edge deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Graph Traversal ─────────────────────────────────────────
  /namespaces/{namespace}/nodes/{id}/children:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getChildren
      summary: Get direct children of a node
      description: Follows BREAKS_DOWN_TO and IMPLEMENTED_BY edges only; DEPENDS_ON edges are ignored.
      responses:
        "200":
          description: List of child nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeArray"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /namespaces/{namespace}/nodes/{id}/parents:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getParents
      summary: Get direct parents of a node
      description: Follows BREAKS_DOWN_TO and IMPLEMENTED_BY edges only; DEPENDS_ON edges are ignored.
      responses:
        "200":
          description: List of parent nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeArray"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /namespaces/{namespace}/nodes/{id}/subtree:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getSubtree
      summary: Get the full descendant tree of a node (recursive)
      description: Follows BREAKS_DOWN_TO and IMPLEMENTED_BY edges only; DEPENDS_ON edges are ignored.
      responses:
        "200":
          description: Tree of descendant nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /namespaces/{namespace}/nodes/{id}/lineage:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getLineage
      summary: Trace ancestors up to the root Vision
      description: Follows BREAKS_DOWN_TO and IMPLEMENTED_BY edges only; DEPENDS_ON edges are ignored.
      responses:
        "200":
          description: Ordered list of ancestor nodes from root to this node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeArray"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Dependencies ────────────────────────────────────────────
  /namespaces/{namespace}/nodes/{id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getDependencies
      summary: Get the nodes this node depends on
      description: Targets of the node's outgoing DEPENDS_ON edges.
      responses:
        "200":
          description: List of nodes this node depends on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeArray"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /namespaces/{namespace}/nodes/{id}/dependents:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getDependents
      summary: Get the nodes that depend on this node
      description: Sources of the node's incoming DEPENDS_ON edges.
      responses:
        "200":
          description: List of nodes that depend on this node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeArray"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Changefeed ──────────────────────────────────────────────
  /namespaces/{namespace}/subscribe:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      operationId: subscribe
      summary: SSE stream of node changes
      description: >
        Server-Sent Events stream of node changes in the namespace, filtered
        by node type(s). If no type param is provided, all changes in the
        namespace are streamed. Each event includes a changeId
        that clients can use to resume via the /changes endpoint.
      parameters:
        - name: type
          in: query
          description: Node type(s) to subscribe to
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NodeType"
          style: form
          explode: true
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /namespaces/{namespace}/changes:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      operationId: listChanges
      summary: Fetch persisted changes since a given changeId
      description: >
        Returns a paginated list of change entries ordered by sequence.
        Clients that missed SSE events can catch up by polling from their
        last known changeId.
      parameters:
        - name: type
          in: query
          required: true
          description: Node type to fetch changes for
          schema:
            $ref: "#/components/schemas/NodeType"
        - name: since
          in: query
          description: Return changes after this changeId (exclusive). Omit to start from the beginning.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: List of change entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          $ref: "#/components/responses/BadRequest"

# ═══════════════════════════════════════════════════════════════
components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      description: >
        Identifier of the namespace the request operates in: 1 to 256 ASCII
        letters, digits, hyphens, underscores, colons and periods, with no
        period at the start or end. Nodoplex attaches no meaning to the value.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9_:-]([A-Za-z0-9_:.-]*[A-Za-z0-9_:-])?$'

    NodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ── Enums ───────────────────────────────────────────────
    NodeType:
      type: string
      enum: [vision, goal, feature, requirement, task, output]

    TaskStatus:
      type: string
      enum: [backlog, in_progress, done, blocked]

    EdgeType:
      type: string
      enum: [BREAKS_DOWN_TO, IMPLEMENTED_BY, DEPENDS_ON]

    ChangeAction:
      type: string
      enum: [created, updated, deleted]

    # ── Error ───────────────────────────────────────────────
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Individual node types ───────────────────────────────
    Vision:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [vision]
        title:
          type: string
        description:
          type: string

    Goal:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [goal]
        title:
          type: string
        description:
          type: string
        targetDate:
          type: string
          format: date
          description: Target completion date for the goal (YYYY-MM-DD)

    Feature:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [feature]
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
          description: Lower number = higher priority

    Requirement:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [requirement]
        title:
          type: string
        description:
          type: string
        acceptanceCriteria:
          type: string

    Task:
      type: object
      required: [id, type, title, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task]
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"

    Output:
      type: object
      description: >
        Something a task produced, such as a Git branch, a document or a
        deployment. Attach it to its task with an `IMPLEMENTED_BY` edge from
        the task. Nodoplex stores `outputType` and `payload` without
        interpreting them.
      required: [id, type, outputType]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [output]
        outputType:
          type: string
          minLength: 1
          description: >
            Kind of output, chosen by the client, for example `git`.
            Nodoplex doesn't interpret it, but `git` has a documented payload
            shape (see GitOutputPayload).
        description:
          type: string
          description: What the output is
        payload:
          $ref: "#/components/schemas/OutputPayload"

    OutputPayload:
      type: object
      additionalProperties: true
      description: >
        Any JSON object. Nodoplex stores it and returns it unchanged, without
        interpreting or validating it. For `outputType: git`, use the shape of
        GitOutputPayload.

    GitOutputPayload:
      type: object
      description: >
        Documented payload shape for an output with `outputType: git`.
        Nodoplex doesn't validate payloads against it.
      properties:
        repository:
          type: string
          description: Git remote URL, for example https://github.com/d4nyll/nodoplex.git
        baseRef:
          type: string
          description: Git ref the work started from, for example `main`
        currentRef:
          type: string
          description: Git ref that holds the work, for example a branch name or a commit SHA

    # ── Polymorphic Node ────────────────────────────────────
    Node:
      oneOf:
        - $ref: "#/components/schemas/Vision"
        - $ref: "#/components/schemas/Goal"
        - $ref: "#/components/schemas/Feature"
        - $ref: "#/components/schemas/Requirement"
        - $ref: "#/components/schemas/Task"
        - $ref: "#/components/schemas/Output"
      discriminator:
        propertyName: type
        mapping:
          vision: "#/components/schemas/Vision"
          goal: "#/components/schemas/Goal"
          feature: "#/components/schemas/Feature"
          requirement: "#/components/schemas/Requirement"
          task: "#/components/schemas/Task"
          output: "#/components/schemas/Output"

    NodeArray:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"

    NodeList:
      type: object
      required: [nodes, total]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        total:
          type: integer
          description: Total number of matching nodes

    NodeWithRelationships:
      type: object
      required: [node, parents, children]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"

    TreeNode:
      type: object
      required: [node, children]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"

    # ── Create / Update requests ────────────────────────────
    CreateNodeRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateVision"
        - $ref: "#/components/schemas/CreateGoal"
        - $ref: "#/components/schemas/CreateFeature"
        - $ref: "#/components/schemas/CreateRequirement"
        - $ref: "#/components/schemas/CreateTask"
        - $ref: "#/components/schemas/CreateOutput"
      discriminator:
        propertyName: type
        mapping:
          vision: "#/components/schemas/CreateVision"
          goal: "#/components/schemas/CreateGoal"
          feature: "#/components/schemas/CreateFeature"
          requirement: "#/components/schemas/CreateRequirement"
          task: "#/components/schemas/CreateTask"
          output: "#/components/schemas/CreateOutput"

    CreateVision:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [vision]
        title:
          type: string
        description:
          type: string

    CreateGoal:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [goal]
        title:
          type: string
        description:
          type: string
        targetDate:
          type: string
          format: date
          description: Target completion date for the goal (YYYY-MM-DD)

    CreateFeature:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [feature]
        title:
          type: string
        description:
          type: string
        priority:
          type: integer

    CreateRequirement:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [requirement]
        title:
          type: string
        description:
          type: string
        acceptanceCriteria:
          type: string

    CreateTask:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          enum: [task]
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"

    CreateOutput:
      type: object
      required: [type, outputType]
      properties:
        type:
          type: string
          enum: [output]
        outputType:
          type: string
          minLength: 1
          description: >
            Kind of output, chosen by the client, for example `git`.
            Nodoplex doesn't interpret it, but `git` has a documented payload
            shape (see GitOutputPayload).
        description:
          type: string
        payload:
          $ref: "#/components/schemas/OutputPayload"

    UpdateNodeRequest:
      type: object
      description: >
        Fields to change. `outputType` and `payload` only apply to Output
        nodes, and `payload` replaces the whole stored payload.
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
          description: Only applicable for Feature nodes
        acceptanceCriteria:
          type: string
          description: Only applicable for Requirement nodes
        status:
          $ref: "#/components/schemas/TaskStatus"
        targetDate:
          type: string
          format: date
          description: Only applicable for Goal nodes (YYYY-MM-DD)
        outputType:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/OutputPayload"

    # ── Edges ───────────────────────────────────────────────
    Edge:
      type: object
      required: [sourceId, targetId, type]
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EdgeType"

    CreateEdgeRequest:
      type: object
      required: [sourceId, targetId, type]
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EdgeType"

    DeleteEdgeRequest:
      type: object
      required: [sourceId, targetId, type]
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EdgeType"

    # ── Changelog ───────────────────────────────────────────
    ChangeEntry:
      type: object
      required: [changeId, action, nodeType, nodeId, timestamp]
      properties:
        changeId:
          type: integer
          format: int64
        action:
          $ref: "#/components/schemas/ChangeAction"
        nodeType:
          $ref: "#/components/schemas/NodeType"
        nodeId:
          type: string
          format: uuid
        node:
          $ref: "#/components/schemas/Node"
        previous:
          $ref: "#/components/schemas/Node"
        timestamp:
          type: string
          format: date-time

    ChangeList:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEntry"
        nextSince:
          type: integer
          format: int64
          description: >
            The changeId of the last entry in the list. Use as the `since`
            parameter in the next request for cursor-based pagination.
