services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme
      POSTGRES_URL: postgres://nodoplex:changeme@postgres:5432/nodoplex?sslmode=disable
      PORT: "8080"
    depends_on:
      neo4j:
        condition: service_started
      postgres:
        condition: service_started

  neo4j:
    image: neo4j:2026-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nodoplex
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: nodoplex
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  neo4j_data:
  pg_data:
